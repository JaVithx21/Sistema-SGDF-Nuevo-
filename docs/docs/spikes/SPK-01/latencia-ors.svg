<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" width="480" height="300" font-family="Arial, Helvetica, sans-serif">
  <rect width="480" height="300" fill="#ffffff"/>
  <!-- Título -->
  <text x="20" y="22" font-size="14" font-weight="bold" fill="#0f172a">Latencia real de OpenRouteService (SPK-01)</text>
  <text x="20" y="38" font-size="10.5" fill="#64748b">Optimización VROOM · 5 repeticiones por tamaño · 26-10-2026</text>

  <!-- Eje Y y grilla (0 a 8 s, 25 px por segundo; base en y=250) -->
  <g font-size="10" fill="#64748b" text-anchor="end">
    <text x="52" y="254">0 s</text>
    <text x="52" y="204">2 s</text>
    <text x="52" y="154">4 s</text>
    <text x="52" y="104">6 s</text>
  </g>
  <g stroke="#e2e8f0" stroke-width="1">
    <line x1="60" y1="200" x2="460" y2="200"/>
    <line x1="60" y1="150" x2="460" y2="150"/>
    <line x1="60" y1="100" x2="460" y2="100"/>
  </g>
  <line x1="60" y1="250" x2="460" y2="250" stroke="#94a3b8" stroke-width="1.2"/>

  <!-- Línea del timeout de 8 s (y = 250 - 200) -->
  <line x1="60" y1="50" x2="460" y2="50" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text x="458" y="45" font-size="10.5" font-weight="bold" fill="#dc2626" text-anchor="end">Timeout DEC-07: 8 s</text>

  <!-- 10 paradas: mediana 0,61 s · máx 1,54 s -->
  <rect x="102" y="234.75" width="34" height="15.25" fill="#005088" rx="2"/>
  <rect x="144" y="211.6" width="34" height="38.4" fill="#7fb3d9" rx="2"/>
  <text x="119" y="229" font-size="10" fill="#0f172a" text-anchor="middle">0,61</text>
  <text x="161" y="206" font-size="10" fill="#0f172a" text-anchor="middle">1,54</text>
  <text x="140" y="268" font-size="11" font-weight="bold" fill="#0f172a" text-anchor="middle">10 paradas</text>

  <!-- 25 paradas: mediana 1,02 s · máx 1,05 s -->
  <rect x="222" y="224.5" width="34" height="25.5" fill="#005088" rx="2"/>
  <rect x="264" y="223.7" width="34" height="26.3" fill="#7fb3d9" rx="2"/>
  <text x="239" y="219" font-size="10" fill="#0f172a" text-anchor="middle">1,02</text>
  <text x="281" y="218" font-size="10" fill="#0f172a" text-anchor="middle">1,05</text>
  <text x="260" y="268" font-size="11" font-weight="bold" fill="#0f172a" text-anchor="middle">25 paradas</text>

  <!-- 50 paradas: mediana 1,53 s · máx 2,69 s -->
  <rect x="342" y="211.7" width="34" height="38.3" fill="#005088" rx="2"/>
  <rect x="384" y="182.8" width="34" height="67.2" fill="#7fb3d9" rx="2"/>
  <text x="359" y="206" font-size="10" fill="#0f172a" text-anchor="middle">1,53</text>
  <text x="401" y="177" font-size="10" fill="#0f172a" text-anchor="middle">2,69</text>
  <text x="380" y="268" font-size="11" font-weight="bold" fill="#0f172a" text-anchor="middle">50 paradas</text>

  <!-- Leyenda y nota -->
  <rect x="62" y="280" width="11" height="11" fill="#005088" rx="2"/>
  <text x="78" y="290" font-size="10.5" fill="#334155">Mediana (s)</text>
  <rect x="158" y="280" width="11" height="11" fill="#7fb3d9" rx="2"/>
  <text x="174" y="290" font-size="10.5" fill="#334155">Máximo (s)</text>
  <text x="458" y="290" font-size="10.5" fill="#334155" text-anchor="end">Respaldo local: &lt; 1 ms · 0 errores 401/403/429</text>
</svg>
